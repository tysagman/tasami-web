<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta name="robots" content="{{robots}}">
{{head_links}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tasami">
<meta property="og:locale" content="{{locale}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:image" content="https://tasami.com.tr/assets/img/oyun/baslik-og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{og_alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#000000">
{{icons}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
{{analytics}}
</head>
<body class="doc-page">
<header class="top solid doc-top">
  <div class="wrap top-in">
    <a class="brand" href="{{home}}" aria-label="Tasami"><img src="/assets/img/tasami-amblem.png" alt="" width="48" height="48"><span>TASA<b>Mİ</b></span></a>
    <nav class="doc-nav" aria-label="{{menu}}"><a href="{{home}}">{{home_label}}</a>{{lang_link}}</nav>
  </div>
</header>

<main class="doc{{doc_cls}}">
  <div class="doc-in">
    {{heading}}
    {{body}}
    {{updated}}
  </div>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <a class="brand" href="{{home}}"><img src="/assets/img/tasami-amblem.png" alt="" width="32" height="32"><span>TASA<b>Mİ</b><em class="slogan">{{slogan}}</em></span></a>
    <span>© 2026 Tasami. {{rights}}</span>
    <span>{{foot_links}}</span>
  </div>
</footer>
{{cookie}}
<script src="/assets/extra.js" defer></script>
</body>
</html>
